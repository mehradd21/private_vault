name: Build Private Vault APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer and cython
        run: python3 -m pip install --upgrade pip buildozer cython==0.29.37

      - name: Prepare python-for-android
        run: |
          git clone -b develop --single-branch https://github.com/kivy/python-for-android.git .p4a
          git -C .p4a checkout 37d272cc42f1ca0d0143743ccd3949cca56dfd5d
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.p4a/pythonforandroid/recipe.py')
          s = p.read_text()
          old = '"build[virtualenv]", "pip"'
          new = '"build[virtualenv]==1.4.2", "pip"'
          if old not in s:
              raise SystemExit('p4a patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build APK
        run: yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-APK
          path: bin/*.apk
          if-no-files-found: error
